name: Probe
on:
  push:
    branches: [main]
    paths: ["collector/probe.py"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m collector.probe
      - run: |
          git config user.name "ready-room-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/probe; git diff --cached --quiet || git commit -m "Probe: raw Grants.gov detail samples"; git push
