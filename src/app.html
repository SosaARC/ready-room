<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ready Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* VOICE: plain, working tool for busy owners; says what is missing and what to do next.
   IDEA: a business's filing cabinet that is always ready to hand over.
   PICTURE: the tool itself; readiness numbers sit in mint fields on the Today view.
   COLOUR and TYPE: black and white plus one mint field; Space Grotesk 700 for headings, Inter for text.
   LAYOUT: left rail of sections on wide screens, scrolling tab row on phones; one column of work. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e0f10);--ink:light-dark(#111214,#f1f2f3);--sub:light-dark(#5b5f66,#a4a9b0);
--line:light-dark(#e3e5e8,#2a2d31);--soft:light-dark(#f5f6f7,#17191b);--mint:#b8f5d0;
--mintink:#0b3b22;--warn:light-dark(#8a4b00,#ffc777);--warnbg:light-dark(#fff3df,#3a2a10);
--bad:light-dark(#a1121d,#ff8a8f);--badbg:light-dark(#ffe9ea,#3b1517);--ok:light-dark(#0b6b3a,#8ff0b6);--okbg:light-dark(#e6f9ee,#12301f)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,4vw,40px)}h2{font-size:22px}h3{font-size:17px}
a{color:inherit}p{margin:.4em 0}
.top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px max(4vw,16px);border-bottom:1px solid var(--line)}
.brand{font-family:"Space Grotesk",Inter,sans-serif;font-weight:700;font-size:20px;margin-right:auto;display:flex;gap:10px;align-items:center}
.brand i{display:inline-block;width:22px;height:22px;border-radius:5px;background:var(--mint);border:2px solid var(--ink)}
.shell{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 64px);align-content:start}
nav.rail{border-right:1px solid var(--line);padding:18px 10px;display:flex;flex-direction:column;gap:2px}
nav.rail a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;white-space:nowrap;border-radius:8px;text-decoration:none;font-weight:500;min-height:44px}
nav.rail a[aria-current=page]{background:var(--ink);color:var(--bg)}
nav.rail a:hover:not([aria-current=page]){background:var(--soft)}
nav.rail .sep{height:1px;background:var(--line);margin:8px 4px}
.count{font-size:13px;padding:1px 8px;border-radius:99px;background:var(--soft);color:var(--sub)}
nav.rail a[aria-current=page] .count{background:var(--mint);color:var(--mintink)}
main{padding:clamp(18px,3vw,40px) max(4vw,16px);max-width:1180px;width:100%}
.lede{color:var(--sub);max-width:68ch;margin:8px 0 22px}
.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--bg)}
.card.soft{background:var(--soft);border-color:transparent}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
label{display:block;font-size:14px;font-weight:500;margin:0 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);min-height:44px}
textarea{min-height:110px;resize:vertical;line-height:1.5}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--ink);flex:none}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--mint);outline-offset:1px;border-color:var(--ink)}
.field{margin-bottom:12px}
.check{display:flex;gap:8px;align-items:center;font-weight:400;min-height:36px}
button,.btn{font:inherit;font-weight:600;font-size:15px;border:1.5px solid var(--ink);background:var(--bg);color:var(--ink);border-radius:8px;padding:9px 14px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button.primary,.btn.primary{background:var(--ink);color:var(--bg)}
button.mint{background:var(--mint);color:var(--mintink);border-color:var(--mintink)}
button.ghost{border-color:var(--line)}
button.sm,.btn.sm{min-height:36px;padding:5px 10px;font-size:14px}
button:disabled{opacity:.5;cursor:default}
.chip{display:inline-block;font-size:13px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--sub);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.ink{background:var(--ink);color:var(--bg)}
.muted{color:var(--sub)}.small{font-size:14px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;font-size:13px;color:var(--sub);font-weight:600;padding:8px;border-bottom:1px solid var(--line)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
td.num,th.num{text-align:right;white-space:nowrap}
.hero{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));border-radius:14px;overflow:hidden;border:1px solid var(--line);margin-bottom:18px}
.hero .num{background:var(--mint);color:var(--mintink);padding:22px}
.hero .num+.num{border-left:2px solid var(--bg)}
.hero .num b{display:block;font-family:"Space Grotesk",Inter,sans-serif;font-size:clamp(48px,7vw,76px);line-height:1}
.hero .list{padding:18px 22px}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--ink)}
.todo{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:0}.todo .chip{flex:none}
.drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.drop.on{border-color:var(--ink);background:var(--soft)}
.ai{border-left:3px solid var(--mint);padding:8px 12px;background:var(--soft);border-radius:0 8px 8px 0;margin-top:10px;font-size:15px}
.note{font-size:14px;color:var(--sub);margin-top:10px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:max-content;text-align:center;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:500;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9;max-width:90vw}
.toast.show{opacity:1}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:8}
.dlg.open{display:flex}.dlg .card{max-width:600px;width:100%;max-height:90vh;overflow:auto}
.empty{padding:28px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--sub)}
.gcard h3{margin-bottom:4px}.gcard,.kv,.todo{overflow-wrap:anywhere}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;margin:10px 0;font-size:14px}
.kv b{display:block;font-size:12px;color:var(--sub);font-weight:600}
.sample{font-size:13px;background:var(--warnbg);color:var(--warn);padding:6px 10px;border-radius:8px;display:inline-block;margin-bottom:12px}
.scroll{overflow-x:auto}
details>summary{cursor:pointer;min-height:40px;display:flex;align-items:center;gap:8px;list-style:none}details>summary::-webkit-details-marker{display:none}details>summary::before{content:'';flex:none;width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin:0 4px}details[open]>summary::before{transform:rotate(45deg)}
.qa{border-top:1px solid var(--line);padding-top:10px;margin-top:10px}
.qa .q{font-weight:600;margin-bottom:6px}
.limit.over{color:var(--bad);font-weight:600}
.checks .check{border-bottom:1px solid var(--line);min-height:44px}.check{min-height:44px}.bud-item{min-width:150px}.kvrow{display:grid;grid-template-columns:minmax(0,38%) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}.kvrow span{overflow-wrap:anywhere}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
@media(max-width:860px){.shell{grid-template-columns:minmax(0,1fr)}nav.rail{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px;scroll-snap-type:x proximity}nav.rail a{flex:none}nav.rail .sep{display:none}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.top{gap:8px}.top .bizlabel{display:none}#bizSel{flex:1 1 140px;width:auto}.brand{font-size:18px;flex:1 1 100%}.g2,.g3{grid-template-columns:1fr}.hero .num+.num{border-left:0;border-top:2px solid var(--bg)}table{font-size:13px}.stack thead{display:none}.stack tr{display:grid;padding-block:10px;border-bottom:1px solid var(--line)}.stack td{display:block;border:0;padding:3px 0;text-align:start}.stack td::before{content:attr(data-l);display:block;color:var(--sub);font-size:12px;font-weight:600}.stack td.num{text-align:start}.kvrow{grid-template-columns:minmax(0,1fr) auto}.kvrow .k{grid-column:1/-1;margin-bottom:-6px}.stack td:empty{display:none}}
</style>
<script>new MutationObserver(()=>{for(const c of document.querySelectorAll('.stack td:not([data-l])')){let i=0,p=c;while(p=p.previousElementSibling)i+=p.colSpan;c.dataset.l=c.closest('table').rows[0].cells[i]?.textContent||''}}).observe(document,{childList:true,subtree:true})</script>
</head>
<body>
<header class="top">
  <div class="brand"><i aria-hidden="true"></i>Ready Room</div>
  <label for="bizSel" class="muted small bizlabel" style="margin:0">Business</label>
  <select id="bizSel" style="width:auto;max-width:280px"></select>
  <button class="sm" data-act="newBiz" disabled>New business</button>
</header>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Sections"></nav>
  <main id="view" aria-live="polite"><p class="muted">Loading your workspace…</p></main>
</div>
<div class="dlg" id="dlg" role="dialog" aria-modal="true"><div class="card" id="dlgBody"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="application/json" id="grants-data">__GRANTS__</script>
<script type="application/json" id="notgrants-data">__NOTGRANTS__</script>
<script type="application/json" id="live-data">__LIVE__</script>
<script type="application/json" id="live-status">__LIVESTATUS__</script>
<script>
{
/* ---------- reference data ---------- */
const GRANTS = safeJSON(document.getElementById('grants-data').textContent, []);
const NOT_GRANTS = safeJSON(document.getElementById('notgrants-data').textContent, []);
const LIVE = safeJSON(document.getElementById('live-data').textContent, []).filter(g=>g&&g.type!=='program');
const LIVE_STATUS = safeJSON(document.getElementById('live-status').textContent, {});
const CATALOG_DATE = '__CATALOG_DATE__';

const DOC_TYPES = [
  {k:'mc_authority',l:'Operating authority (MC) letter',g:'carrier',exp:false},
  {k:'coi',l:'Certificate of insurance (COI)',g:'carrier',exp:true},
  {k:'w9',l:'W-9',g:'both',exp:false},
  {k:'noa_or_bank',l:'Notice of assignment or bank letter / voided check',g:'carrier',exp:false},
  {k:'boc3',l:'BOC-3 process agent filing',g:'carrier',exp:false},
  {k:'ucr',l:'UCR registration',g:'carrier',exp:true},
  {k:'mcs150',l:'MCS-150 update (every 2 years)',g:'carrier',exp:true},
  {k:'carrier_agreement',l:'Signed broker-carrier agreement',g:'carrier',exp:false},
  {k:'med_card',l:'DOT medical card',g:'carrier',exp:true},
  {k:'license',l:"Driver's license / CDL",g:'carrier',exp:true},
  {k:'registration',l:'Vehicle registration',g:'carrier',exp:true},
  {k:'dot_inspection',l:'Annual DOT inspection',g:'carrier',exp:true},
  {k:'ein_letter',l:'IRS EIN letter',g:'both',exp:false},
  {k:'articles',l:'Articles of organization / incorporation',g:'grant',exp:false},
  {k:'good_standing',l:'Certificate of good standing',g:'grant',exp:true},
  {k:'business_license',l:'Business license',g:'grant',exp:true},
  {k:'business_plan',l:'Business plan',g:'grant',exp:false},
  {k:'financials',l:'Financial statements (P&L, balance sheet)',g:'grant',exp:false},
  {k:'tax_returns',l:'Tax returns',g:'grant',exp:false},
  {k:'budget',l:'Project budget',g:'grant',exp:false},
  {k:'capability',l:'Capability statement',g:'grant',exp:false},
  {k:'irs_501c3',l:'501(c)(3) determination letter',g:'grant',exp:false},
  {k:'hub_cert',l:'Small business certification (NCSBE, MBE, DBE)',g:'grant',exp:true},
  {k:'sam_uei',l:'SAM.gov registration (UEI)',g:'grant',exp:true},
  {k:'support_letters',l:'Letters of support',g:'grant',exp:false},
  {k:'resume',l:'Owner resume / bios',g:'grant',exp:false},
  {k:'other',l:'Other',g:'both',exp:false}
];
const DT = Object.fromEntries(DOC_TYPES.map(d=>[d.k,d]));
const isDT = k=>typeof k==='string'&&Object.prototype.hasOwnProperty.call(DT,k);
const CARRIER_CORE = ['mc_authority','coi','w9','noa_or_bank','boc3'];
const BROKER_DEFAULT = ['mc_authority','coi','w9','noa_or_bank'];
const GIG_DEFAULT = ['license','registration','coi'];
const ONBOARD = ['Highway','RMIS','MyCarrierPackets','Carrier Assure','Broker portal','Mobile app','Email','Other'];
const QUICK = [
  {name:'TQL',kind:'broker'},{name:'C.H. Robinson',kind:'broker'},{name:'Uber Freight',kind:'broker'},
  {name:'Amazon Relay',kind:'board'},{name:'GoShare',kind:'gig'},{name:'Roadie',kind:'gig'}];
const KIND_LABEL = {broker:'Broker',board:'Load board / shipper platform',gig:'Gig delivery app'};
const GRANT_DOC_MAP = {'business plan':'business_plan','financial statements':'financials','tax returns':'tax_returns','budget':'budget','articles of incorporation':'articles','501c3 letter':'irs_501c3','w-9':'w9','certificate of good standing':'good_standing','capability statement':'capability','letters of support':'support_letters','hub certification':'hub_cert','duns/uei + sam registration':'sam_uei'};
const ANSWER_SECTIONS = [
  ['desc_short','Business description (2 sentences)'],['desc_long','Business description (full)'],['exec_summary','Executive summary'],
  ['mission','Mission'],['org_history','Organizational history'],['need','Need statement: the problem and who has it'],
  ['goals','Goals, objectives and activities'],['use_of_funds','Use of funds'],['budget_narrative','Budget narrative'],
  ['impact','Impact and how you will measure it'],['evaluation','Evaluation plan'],['timeline','Timeline and workplan'],
  ['jobs','Jobs created or kept'],['community','Community served'],['owner_bio','Owner or leadership bio'],
  ['personnel','Key personnel and board'],['capacity','Organizational capacity'],['partnerships','Partnerships'],
  ['track_record','Track record and results so far'],['sustainability','How the work continues after the grant']
];
const STAGES = ['Prospect','LOI sent','Invited','Drafting','Submitted','Under review','Awarded','Reporting','Declined','Closed'];
const ACTIVE = new Set(['Prospect','LOI sent','Invited','Drafting','Submitted','Under review','Awarded','Reporting']);
const BROKER_STATUS = ['Not started','Docs ready','Onboarding started','Pending approval','Approved','Rejected'];
const COI_STATES = ['Not requested','Requested from agent','Received'];
const ENTITY = [['llc','LLC','for-profit'],['corp','Corporation','for-profit'],['sole','Sole proprietor','for-profit'],['partnership','Partnership','for-profit'],['np501c3','Nonprofit, 501(c)(3)','nonprofit'],['np_pending','Nonprofit, 501(c)(3) pending or fiscally sponsored','nonprofit'],['np_other','Nonprofit, other (501(c)(4), (c)(6))','nonprofit'],['gov','Government or school','government']];
const FOCUS_OPTS = [['minority-owned','Minority-owned'],['women-owned','Women-owned'],['veteran','Veteran or military spouse owned'],['rural','Located in a rural area'],['agriculture','Farm or agriculture'],['local-service','Local service business (trucking, trades, food, retail)'],['research','Developing a new product or technology (R&D)'],['export','Sell or plan to sell outside the US'],['transportation','Transportation / logistics'],['workforce','Workforce / job training'],['energy','Energy / efficiency'],['disability-services','Provide disability or vocational rehab services'],['diesel-fleet','Own an older diesel truck or equipment to replace'],['arts','Artist or arts organization'],['youth-education','Youth or education'],['health','Health'],['low-income','Serve low-income residents'],['economic-mobility','Economic mobility / jobs'],['community-development','Community development']];
const VIEWS = [['today','Today'],['all','All businesses'],['sep'],['profile','Profile'],['vault','Document vault'],['brokers','Broker setups'],['sep'],['shortlist','Shortlist'],['grants','Grant finder'],['answers','Answer bank'],['pipeline','Grant applications'],['sep'],['data','Your data']];
const VIEW_KEYS = VIEWS.filter(v=>v[0]!=='sep').map(v=>v[0]);

/* ---------- helpers ---------- */
function safeJSON(t,f){try{return JSON.parse(t)}catch(e){return f}}
const $ = s=>document.querySelector(s);
const esc = v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=>Math.random().toString(36).slice(2,10);
const safeUrl = u=>{u=String(u||'').trim();return /^https:\/\//i.test(u)?u:''};
const ymd = x=>x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0');
const todayStr = ()=>ymd(new Date());
const valid = s=>/^\d{4}-\d{2}-\d{2}$/.test(s||'')?s:'';
function daysUntil(s){if(!valid(s))return null;const [y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1,d);const n=new Date();n.setHours(0,0,0,0);return Math.round((t-n)/864e5)}
function fmtDate(s){if(!valid(s))return s||'';const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'})}
const words = t=>String(t||'').trim()?String(t).trim().split(/\s+/).length:0;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2600)}
async function copyRaw(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){toast('Select the text and copy it')}}
async function copy(text){try{await navigator.clipboard.writeText(text);toast('Copied')}catch(e){openDlg(`<h3>Copy this</h3><textarea style="min-height:260px" readonly>${esc(text)}</textarea><div class="row" style="margin-top:12px"><button data-act="closeDlg">Close</button></div>`)}}
let lastFocus=null;function openDlg(html,opt={}){if(!$('#dlg').classList.contains('open'))lastFocus=document.activeElement;$('#dlgBody').innerHTML=html;$('#dlg').classList.add('open');$('#dlgBody').parentElement.scrollTop=0;$('#dlgBody').scrollTop=0;if(opt.focus===false){const h=$('#dlgBody h2,#dlgBody h3');if(h){h.tabIndex=-1;h.focus()}return}const f=$('#dlgBody').querySelector('input,textarea,select,button');f&&f.focus()}
function closeDlg(){$('#dlg').classList.remove('open');if(lastFocus&&document.contains(lastFocus))try{lastFocus.focus()}catch(e){}lastFocus=null}
const entClass = p=>(ENTITY.find(e=>e[0]===p.entityType)||ENTITY[0])[2];
function normCounty(c){return String(c||'').toLowerCase().replace(/county/g,'').replace(/,?\s*(nc|north carolina)\b/g,'').replace(/[^a-z\s-]/g,'').trim()}
function authorityDays(p){const d=daysUntil(p.authorityDate);return d==null?null:-d}
function docStatus(doc){const t=DT[doc.type];const d=daysUntil(doc.expires);if(!doc.expires){return t&&t.exp?{c:'warn',t:'Add expiry date'}:{c:'',t:'No expiry'}}if(d<0)return {c:'bad',t:`Expired ${fmtDate(doc.expires)}`};if(d<=30)return {c:'warn',t:`Expires in ${d} day${d===1?'':'s'}`};if(d<=60)return {c:'warn',t:`Expires ${fmtDate(doc.expires)}`};return {c:'ok',t:`Valid to ${fmtDate(doc.expires)}`}}
function bestDoc(b,type){const ds=b.documents.filter(d=>d.type===type);if(!ds.length)return null;ds.sort((a,c)=>(c.expires||'9999').localeCompare(a.expires||'9999'));return ds[0]}
function haveValid(b,type){const d=bestDoc(b,type);if(!d)return 'missing';const n=daysUntil(d.expires);if(n!=null&&n<0)return 'expired';if(n!=null&&n<=60)return 'expiring';return 'ok'}
const usable = s=>s==='ok'||s==='expiring';
function stateChip(h){return `<span class="chip ${h==='ok'?'ok':h==='missing'||h==='expired'?'bad':'warn'}">${h==='ok'?'Ready':h==='missing'?'Missing':h==='expired'?'Expired':'Expiring'}</span>`}

/* ---------- storage ---------- */
const store = {
  mode:'memory', db:null, uid:null, timers:{}, writing:{}, pending:{},
  async init(){
    try{if(window.claude&&window.claude.use){const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);if(db&&user){const id=await user.id();if(id){this.db=db;this.uid=id;this.mode='cloud';return}}}}catch(e){}
    try{localStorage.setItem('rr.t','1');localStorage.removeItem('rr.t');this.mode='local'}catch(e){this.mode='memory'}
  },
  async loadAll(){
    if(this.mode==='cloud'){const snap=await this.db.collection('data/users/'+this.uid).get();const out={};for(const d of snap.docs){if(d.id.startsWith('biz_')){const v=d.data();if(v&&v.biz)out[v.biz.id]=v.biz}}return out}
    if(this.mode==='local'){try{return JSON.parse(localStorage.getItem('rr.v1')||'{}')}catch(e){return {}}}
    return {};
  },
  save(b){if(!b)return;clearTimeout(this.timers[b.id]);this.timers[b.id]=setTimeout(()=>{delete this.timers[b.id];this.flush(b.id)},700)},
  flushAll(){for(const id in this.timers){clearTimeout(this.timers[id]);delete this.timers[id];this.flush(id)}},
  async flush(id){
    const b=state.businesses[id];if(!b)return;

const RECUR=/monthly|rolling|annual|twice a year|each year|quarterly|ongoing/i;
function assess(g,b){
  const p=b.profile,ent=entClass(p),why=[],flags=[],notes=[];let ok=true,score=50;

  else if(g.level==='state'&&(reg.includes('north carolina')||/\bnc\b/.test(reg))){if(st==='NC'||st==='NORTH CAROLINA'){why.push('North Carolina program');score+=8}else{ok=false;flags.push('NC only')}}

  const exc=(g.excludes_any||[]).filter(m=>mine.has(m));if(exc.length){ok=false;flags.push('Excludes: '+exc.map(m=>(FOCUS_OPTS.find(f=>f[0]===m)||[m,m])[1].toLowerCase()).join(', '))}
  if(g.min_years){if(p.founded){const age=new Date().getFullYear()-Number(p.founded);if(age<g.min_years){ok=false;flags.push(`Business must be ${g.min_years}+ year${g.min_years>1?'s':''} old`)}}else notes.push(`Needs ${g.min_years}+ years in business: add your year founded`)}
  if(g.employees_range){const [lo,hi]=g.employees_range;if(p.employees!==''&&p.employees!=null){const n=Number(p.employees);if(n<lo||n>hi){ok=false;flags.push(`Needs ${lo} to ${hi} workers`)}}else notes.push(`Needs ${lo} to ${hi} workers: add your headcount`)}
  const hits=(g.focus||[]).filter(f=>mine.has(f)&&!['local-service','startup'].includes(f)||f==='startup'&&mine.has('startup'));if(hits.length){why.push('Matches: '+[...new Set(hits)].map(t=>((FOCUS_OPTS.find(f=>f[0]===t)||[t,t.replace(/-/g,' ')])[1]).toLowerCase()).join(', '));score+=Math.min(30,hits.length*12)}
  if((g.focus||[]).includes('general'))score+=4;

  const r=readiness(g,b);if(r)score+=Math.round(r.have/r.total*15);
  if(!ok)score-=100;
  return {ok,score,why,flags,notes,ready:r};
}

/* ---------- funnel: apply now / prepare / skip ---------- */
const DOC_NEED={business_plan:'a business plan',financials:'financial statements',tax_returns:'tax returns',budget:'a project budget',articles:'articles of organization',irs_501c3:'a 501(c)(3) letter (or a fiscal sponsor)',w9:'a W-9',good_standing:'a certificate of good standing',capability:'a capability statement',support_letters:'letters of support',hub_cert:'a small business certification',sam_uei:'a SAM.gov registration'};
function prepDays(g,b){let base={federal:21,state:14,local:10,'national-private':4}[g.level]??10;if(g.type==='contract')base=10;const need=[];
  const missing=grantDocs(g).filter(d=>d.key&&!usable(haveValid(b,d.key))).map(d=>d.key);
  if(g.level==='federal'&&!usable(haveValid(b,'sam_uei'))&&!String(b.profile.uei||'').trim()){base+=28;need.push('Register in SAM.gov and get a UEI (allow several weeks)')}
  const rest=missing.filter(m=>m!=='sam_uei');base+=3*rest.length;need.push(...rest.map(m=>'Get '+(DOC_NEED[m]||m)));
  if(g.type!=='contract'&&Object.values(b.answers).filter(v=>String(v||'').trim().length>40).length<4){base+=5;need.push('Write the core answers in the answer bank (need, use of funds, impact)')}
  return {days:base,need}}
function oddsOf(g){const n=g.expected_awards;if(g.level==='national-private')return ['Long shot','national program, many applicants per award'];if(typeof n==='number'&&n>0&&n<=3)return ['Long shot',`only ${n} award${n>1?'s':''} expected`];if(g.level==='local'||g.level==='state')return ['Better','local or state pool, fewer applicants'];return ['Fair','competitive national pool']}
function funnel(g,b){const a=assess(g,b);if(!a.ok)return {bucket:'skip',why:a.flags,score:0,a};
  if(g.type==='program')return {bucket:'skip',why:['Program listing, not an open call'],score:0,a};
  const {days,need}=prepDays(g,b),dd=daysUntil(g.deadline),recur=RECUR.test(g.deadline_text||'')||!g.deadline,[od,odWhy]=oddsOf(g);
  const why=a.why.concat(a.notes.filter(n=>!n.startsWith('Needs')));const base={a,odds:od,oddsWhy:odWhy,need,days};
  if(a.score<50)return {...base,bucket:'skip',why:['Weak fit for this business'],score:a.score};
  if(dd!=null&&dd<days){if(recur)return {...base,bucket:'prepare',why:[dd<0?`Last round closed ${fmtDate(g.deadline)}. Get ready for the next one.`:`Due in ${dd} days, but you need about ${days}. Get ready for the next round.`].concat(why),score:a.score};return {...base,bucket:'skip',why:[`Not enough time: due in ${dd} days, about ${days} days of prep needed`],score:a.score}}
  const unknown=a.notes.filter(n=>n.startsWith('Needs'));
  if(need.some(n=>n.includes('SAM.gov'))||unknown.length)return {...base,bucket:'prepare',why:unknown.concat(why),score:a.score};
  return {...base,bucket:'apply',why:[dd!=null?`Due ${fmtDate(g.deadline)} (${dd} days)`:'Open or rolling'].concat(why),score:a.score+(od==='Better'?10:od==='Long shot'?-10:0)+(dd!=null&&dd<=45?5:0)}}
let _fc={key:null,val:null};
function funnelAll(b){const key=JSON.stringify([b.id,b.profile,b.documents.map(d=>[d.type,d.expires]),Object.keys(b.answers).filter(k=>(b.answers[k]||'').length>40),b.customGrants.length,todayStr()]);if(_fc.key===key)return _fc.val;
  const out={apply:[],prepare:[],skip:[],skipWhy:{}};for(const g of allGrants()){const f=funnel(g,b);out[f.bucket].push({g,f});if(f.bucket==='skip'){const k=String(f.why[0]||'Other').split(':')[0].replace(/\s*\(.*$/,'');out.skipWhy[k]=(out.skipWhy[k]||0)+1}}
  out.apply.sort((x,y)=>y.f.score-x.f.score);out.prepare.sort((x,y)=>y.f.score-x.f.score);_fc={key,val:out};return out}

/* ---------- attention items (one business) ---------- */
function attention(b){
  const items=[],p=b.profile,ad=authorityDays(p);
  for(const d of b.documents){if(DT[d.type]?.exp&&d.type!=='other'&&bestDoc(b,d.type)!==d)continue;const n=daysUntil(d.expires);const nm=DT[d.type]?.l||d.title;if(n!=null&&n<0)items.push({c:'bad',t:`${nm} expired ${fmtDate(d.expires)}`,go:'vault',date:d.expires});else if(n!=null&&n<=60)items.push({c:'warn',t:`${nm} expires in ${n} days`,go:'vault',date:d.expires});else if(DT[d.type]?.exp&&!d.expires)items.push({c:'warn',t:`Add the expiry date for ${d.title||nm}`,go:'vault'})}
  const coiDoc=bestDoc(b,'coi'),missBy={};
  for(const br of b.brokers){if(br.status==='Approved'&&br.kind==='broker'){if(!br.agreement)items.push({c:'warn',t:`${br.name}: approved, but the carrier agreement isn't marked signed`,go:'brokers'});if(br.coi==='Received'&&coiDoc&&valid(coiDoc.issued)&&valid(br.coiReceivedOn)&&coiDoc.issued>br.coiReceivedOn)items.push({c:'warn',t:`${br.name}: your policy renewed, so ask your agent to reissue their COI`,go:'brokers'})}
    if(['Approved','Rejected'].includes(br.status))continue;
    const miss=br.required.filter(k=>!usable(haveValid(b,k)));
    if(br.minDays&&ad!=null&&ad<Number(br.minDays))items.push({c:'warn',t:`${br.name}: wants authority ${br.minDays}+ days old; yours is ${ad} days`,go:'brokers'});
    if(miss.length){for(const k of miss)(missBy[k]=missBy[k]||[]).push(br.name)}
    else if(br.kind==='broker'&&br.coi!=='Received')items.push({c:'warn',t:`${br.name}: ${br.coi==='Not requested'?'ask your agent for a COI naming them':'waiting on COI from your agent'}`,go:'brokers'});
    else if(br.status==='Not started')items.push({c:'ok',t:`${br.name}: ready to start onboarding`,go:'brokers'})}
  for(const k in missBy){const n=missBy[k];items.push({c:'warn',t:`${DT[k]?.l||k} ${haveValid(b,k)==='expired'?'expired':'missing'}: holds up ${n.length>2?n.length+' setups':n.join(' and ')}`,go:'vault'})}

  return items;
}

function setupSteps(b){const p=b.profile,carrier=!!(p.usdot||p.mc||b.brokers.length);return [
  ['Profile basics: entity type, county and industry',!!(p.entityType&&p.county&&p.industry),'profile'],
  [carrier?'Carrier details: USDOT, MC, authority date and insurance agent':'Grant focus areas and what the funding is for',carrier?!!(p.usdot&&p.mc&&p.authorityDate&&(p.agentEmail||p.agentName)):!!((p.focus||[]).length&&p.fundingUse),'profile'],
  (()=>{const noExp=b.documents.filter(d=>DT[d.type]?.exp&&!valid(d.expires)).map(d=>DT[d.type].l);const n=b.documents.length;return [n<3?`Add at least 3 documents to the vault (${n} so far)`:noExp.length?`Add expiry dates: ${noExp.join(', ')}`:'At least 3 documents in the vault, with expiry dates',n>=3&&!noExp.length,'vault']})(),
  [carrier?'Your first broker setups tracked':'Your first grant tracked',carrier?b.brokers.length>0:b.pipeline.length>0,carrier?'brokers':'grants'],
  ['Two answer bank sections written',ANSWER_SECTIONS.filter(([k])=>(b.answers[k]||'').trim().length>40).length>=2,'answers']]}
function setupDone(b){return setupSteps(b).every(s=>s[1])}
function setupCard(b){if(setupDone(b))return '';const st=setupSteps(b),n=st.filter(s=>s[1]).length;return `<div class="card soft"><div class="row between"><h2>Get set up</h2><span class="chip ink">${n} of ${st.length}</span></div>${st.map(([t,d,go])=>`<div class="todo"><span class="chip ${d?'ok':''}">${d?'Done':'To do'}</span><a href="#${go}" ${d?'class="muted"':''}>${esc(t)}</a></div>`).join('')}</div>`}

function allDates(){
  const out=[];
  for(const b of Object.values(state.businesses)){
    for(const d of b.documents){if(d.type!=='other'&&bestDoc(b,d.type)!==d)continue;if(valid(d.expires))out.push({bizId:b.id,uid:b.id+'-'+d.id,go:'vault',biz:b.profile.name,what:`${DT[d.type]?.l||d.title} expires`,date:d.expires})}
    for(const g of b.pipeline){if(!ACTIVE.has(g.status))continue;for(const [k,l] of [['deadline','deadline'],['docsDue','client documents due'],['draftDue','draft due'],['reportDue','report due']])if(valid(g[k]))out.push({bizId:b.id,uid:b.id+'-'+g.id+'-'+k,go:'pipeline',biz:b.profile.name,what:`${g.name}: ${l}`,date:g[k]})}
  }
  return out.sort((a,c)=>a.date.localeCompare(c.date));
}

function icsFile(){
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const escI=t=>String(t).replace(/[\\;,]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const bytes=t=>typeof TextEncoder!=='undefined'?new TextEncoder().encode(t).length:unescape(encodeURIComponent(t)).length;
  const fold=line=>{if(bytes(line)<=75)return line;let out='',cur='';for(const ch of line){if(bytes(cur+ch)>(out?74:75)){out+=(out?'\r\n ':'')+cur;cur=ch}else cur+=ch}return out+'\r\n '+cur};
  const ev=allDates().map(x=>{const d=x.date.replace(/-/g,'');const [y,m,dd]=x.date.split('-').map(Number);const n=ymd(new Date(y,m-1,dd+1)).replace(/-/g,'');return ['BEGIN:VEVENT',`UID:${x.uid}@readyroom`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${n}`,`SUMMARY:${escI(x.biz+': '+x.what)}`,'BEGIN:VALARM','TRIGGER:-P7D','ACTION:DISPLAY',`DESCRIPTION:${escI(x.what)}`,'END:VALARM','END:VEVENT'].map(fold).join('\r\n')}).join('\r\n');
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Ready Room//EN\r\nCALSCALE:GREGORIAN\r\n${ev}\r\nEND:VCALENDAR\r\n`;
}

async function approvalScan(){
  const b=biz(),startId=state.activeId;state.ui.apBusy=true;render();
  const mcp=await getMcp();
  if(!mcp){state.ui.apBusy=false;state.ui.approvals={error:'Checking Gmail works when this page is open in Claude with the Gmail connector added.'};render();return}
  try{
    const r=await mcp.callTool('Gmail','search_threads',{query:'newer_than:60d (RMIS OR Highway OR MyCarrierPackets OR "Carrier Assure" OR "carrier setup" OR "carrier packet" OR onboarding OR "carrier profile") (approved OR approval OR welcome OR complete OR completed OR "action required" OR "missing" OR declined OR "carrier number" OR "carrier ID")',pageSize:30,view:'THREAD_VIEW_MINIMAL'});
    const th=((r.payload&&r.payload.threads)||[]).map(t=>{const m=(t.messages||[])[0]||{};return {subject:m.subject||'',sender:m.sender||'',snippet:m.snippet||'',url:safeUrl(t.viewUrl||m.viewUrl)||('https://mail.google.com/mail/u/0/#all/'+encodeURIComponent(t.id))}});
    if(!th.length){state.ui.approvals={items:[]};state.ui.apBusy=false;render();return}
    const names=b.brokers.map(x=>x.name);
    const out=await askJSON(`These are recent emails to a small trucking carrier about broker onboarding. For each email that is about a specific broker or load board's setup, report what it says. Known setups: ${names.join('; ')}.\nReturn JSON: {"items":[{"email":index,"broker":"the broker's name as it appears, or one of the known setups if it clearly matches","status":"Approved"|"Pending approval"|"Action needed"|"Rejected","carrierId":"carrier or vendor ID if stated, else empty","note":"one short line on what the email asks or says"}]}. Skip marketing and anything not about a setup. Use only what the emails say.\n\nEMAILS\n${th.map((t,i)=>`${i}. from: ${t.sender} | subject: ${t.subject} | ${t.snippet}`).join('\n')}`);
    if(state.activeId!==startId){state.ui.apBusy=false;return}
    const norm=x=>String(x||'').toLowerCase().replace(/[^a-z0-9]/g,'');
    const items=((out&&out.items)||[]).filter(x=>x&&th[x.email]).map((x,i)=>{const nb=norm(x.broker);const br=b.brokers.find(y=>{const ny=norm(y.name);return ny&&nb&&(ny.includes(nb)||nb.includes(ny))});const st=['Approved','Pending approval','Action needed','Rejected'].includes(x.status)?x.status:'Pending approval';return {i,brokerId:br?br.id:null,name:String(x.broker||'Unknown'),status:st,carrierId:String(x.carrierId||''),note:String(x.note||''),subject:th[x.email].subject,url:th[x.email].url,done:false}});
    state.ui.approvals={items};
  }catch(e){state.ui.approvals={error:e&&e.code&&e.code!=='ai_err'&&e.code!=='no_ai'&&e.code!=='rate'?mcpErrMsg(e):(e.message||'Could not check Gmail')}}
  state.ui.apBusy=false;render();
}

function limitOf(q){const m=String(q).match(/(\d{1,3}(?:,\d{3})+|\d{1,5})\s*-?\s*(words?|characters?|chars?)/i);return m?{n:+m[1].replace(/,/g,''),unit:/^w/i.test(m[2])?'words':'chars'}:null}

const DOC_KEYS_TEXT = DOC_TYPES.map(d=>`${d.k} = ${d.l}`).join('\n');
async function aiReadFile(file){
  const box=$('#aiRead');if(!box)return;box.innerHTML='<div class="ai">Reading the document…</div>';
  const instr=`You are filing a small business's document. Identify it and return JSON only:
{"type": one key from the list, "title": short description, "issuer": who issued it or "", "issued": "YYYY-MM-DD" or "", "expires": "YYYY-MM-DD" or "", "notes": one short line on what a broker or funder would care about (for a COI: coverage types and limits, and the certificate holder if shown) or ""}
Use only what is written on the document. If a date is not printed, leave it "". Never guess an expiry.
Document type keys:
${DOC_KEYS_TEXT}`;
  try{
    let out;
    if(file.type.startsWith('image/')){const s=await getSample();const lim=s&&s.limits?await s.limits():null;if(!lim||!lim.images)throw {message:'Photo reading is not available here. Try a PDF, or enter the details by hand.'};out=await askJSON(instr+'\n\nThe document is the attached image.',{images:[file]})}
    else{let text='';if(file.type==='application/pdf'||/\.pdf$/i.test(file.name))text=await pdfText(file);else text=await file.text();text=text.replace(/\s+/g,' ').trim().slice(0,14000);if(text.length<20)throw {message:'No readable text in that PDF (it may be a scan). Upload a photo of it instead.'};out=await askJSON(instr+'\n\nFile name: '+file.name+'\nDocument text:\n'+text)}
    if(!out||!isDT(out.type))out={...(out||{}),type:'other'};
    state.ui.pendingGmail=null;openDlg(docForm({id:'',type:out.type,title:out.title||file.name,issuer:out.issuer||'',issued:valid(out.issued),expires:valid(out.expires),link:'',where:'',notes:out.notes||''}));
    box.innerHTML='<div class="ai">Check what Claude read, then save.</div>';
  }catch(e){box.innerHTML=`<div class="ai">${aiErr(e)}</div>`}
}
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`))return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej({message:'Could not load the PDF reader.'});document.head.appendChild(s)})}
async function pdfText(file){
  const base='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  await loadScript(base+'pdf.worker.min.js');await loadScript(base+'pdf.min.js');
  const lib=window.pdfjsLib;if(!lib)throw {message:'PDF reader unavailable.'};lib.GlobalWorkerOptions.workerSrc=base+'pdf.worker.min.js';
  const pdf=await lib.getDocument({data:new Uint8Array(await file.arrayBuffer()),isEvalSupported:false}).promise;
  let t='';for(let i=1;i<=Math.min(pdf.numPages,4);i++){const pg=await pdf.getPage(i);const c=await pg.getTextContent();t+=c.items.map(x=>x.str).join(' ')+'\n'}return t;
}

async function gmailClassify(){

async function intakeFill(text){
  const b=biz();const msg=$('#inMsg');if(msg)msg.textContent='Claude is reading…';
  const keys=['legalName','dba','entityType','address','city','county','state','founded','employees','industry','revenue','budget','certs','fundingUse','fundingAmount','email','phone','website'];
  try{
    const o=await askJSON(`Fill a business profile from a client's intake answers. Use only what they wrote; leave "" for anything not stated. entityType must be one of: ${ENTITY.map(e=>e[0]).join(', ')}. focus is an array from: ${FOCUS_OPTS.map(f=>f[0]).join(', ')} (only ones they clearly said). Never include full EINs, SSNs or bank numbers. Return JSON with keys: ${keys.join(', ')}, focus, "summary" (2 sentences describing the business, from their words), "community" (who they serve, from their words, or ""), and "results" (results so far, from their words, or "").\n\nANSWERS:\n${text.slice(0,12000)}`);
    const p=b.profile;let n=0;
    for(const k of keys){const v=o&&o[k];if(v&&String(v).trim()&&!String(p[k]||'').trim()){if(k==='entityType'&&!ENTITY.some(e=>e[0]===v))continue;p[k]=String(v);n++}}
    if(Array.isArray(o.focus)){const s=new Set(p.focus);o.focus.filter(f=>FOCUS_OPTS.some(x=>x[0]===f)).forEach(f=>s.add(f));p.focus=[...s]}
    if(o.summary&&!(b.answers.desc_short||'').trim())b.answers.desc_short=String(o.summary);
    if(o.community&&!(b.answers.community||'').trim())b.answers.community=String(o.community);
    if(o.results&&!(b.answers.track_record||'').trim())b.answers.track_record=String(o.results);
    if(o.legalName&&p.name==='My business')p.name=String(o.legalName);
    store.save(b);closeDlg();render();toast(`Filled ${n} fields. Check them.`);
  }catch(e){if(msg)msg.textContent=e.message||'Could not read that'}
}

  if(el.dataset.bud==='source'||el.dataset.pp==='status'){touch();render();return}
  if(el.dataset.bud==='amount'||['deadline','ask'].includes(el.dataset.pp)){touch();return}
  if(el.dataset.ui==='grantLevel'){state.ui.grantLevel=el.value;render();return}
  if(el.dataset.ui==='onlyEligible'||el.dataset.ui==='showLoans'){state.ui[el.dataset.ui]=el.checked;render();return}
  if(el.dataset.reuse&&el.value){const k=el.dataset.reuse,src=state.businesses[el.value];if(src){const t=src.answers[k]||'';const go=()=>{b.answers[k]=t;state.ui.open['a_'+k]=true;touch();render();toast('Copied from '+src.profile.name+'. Edit the details for this business.')};if((b.answers[k]||'').trim()){state.ui.pendingReuse=go;openDlg(`<h3>Replace this section?</h3><p>Your current text will be replaced with ${esc(src.profile.name)}'s version.</p><div class="row"><button class="primary" data-act="reuseGo">Replace</button><button data-act="closeDlg">Keep mine</button></div>`)}else go()}el.value='';return}
  if(el.id==='fileIn'&&el.files[0])aiReadFile(el.files[0]);
});
document.addEventListener('focusout',e=>{const d=e.target.dataset||{};if(['deadline','ask'].includes(d.pp)||d.pf==='authorityDate'||d.bud==='amount')setTimeout(()=>{if(!$('#view').contains(document.activeElement)||document.activeElement===document.body)render()},0)});
window.addEventListener('pagehide',()=>store.flushAll());document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')store.flushAll()});
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.add('on')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d)d.classList.remove('on')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('#drop');if(d){e.preventDefault();d.classList.remove('on');const f=e.dataTransfer.files[0];if(f)aiReadFile(f)}});

/* ---------- boot ---------- */
(async()=>{
  const h=location.hash.slice(1);if(VIEW_KEYS.includes(h))state.view=h;
  const timer=setTimeout(()=>{if(!state.loaded)$('#view').innerHTML='<p class="muted">Still connecting to your saved data. You can keep waiting, or this page will work in this browser only.</p>'},10000);
  await store.init();
  try{const all=await store.loadAll();for(const k in all)all[k]=migrate(all[k]);state.businesses={...all,...state.businesses}}catch(e){state.businesses={};toast('Could not load saved data')}
  state.loaded=true;clearTimeout(timer);
  let a=state.activeId;if(!a)try{a=localStorage.getItem('rr.active')}catch(_){}
  setActive(state.businesses[a]?a:(Object.keys(state.businesses)[0]||null));$('[data-act=newBiz]').disabled=false;
  render();
})();
}
</script>
</body>
</html>
